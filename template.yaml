AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexFlow API - Lambda with API Gateway (HTTP API)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Tags:
      Project: lexflow
      Environment: !Ref Environment
      CostCenter: billable

Resources:
  LexFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-api-${Environment}"
      RetentionInDays: 7

  LexFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Domain:
        DomainName: api.probius.app
        CertificateArn: arn:aws:acm:sa-east-1:394559824800:certificate/4004112d-a1b0-4046-9b4f-8801af5e7c23
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
      # Bearer-token auth (no cookies); custom domain: api.probius.app
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - svix-id
          - svix-timestamp
          - svix-signature
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  LexFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowApiLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
        External:
          - pg-native
          - better-sqlite3
          - tedious
          - sqlite3
          - mysql
          - mysql2
          - pg-query-stream
          - oracledb
    Properties:
      FunctionName: !Sub lexflow-api-${Environment}
      CodeUri: .
      Handler: api/handler.handler
      Tracing: PassThrough
      # Shared VPC with the mrhewbuc-rds RDS instance (same SG + subnets as the
      # other MrHewbuc projects). No NAT — Lambda reaches RDS directly via the
      # private subnets.
      VpcConfig:
        SecurityGroupIds:
          - sg-0d065bb06c8c04a68
        SubnetIds:
          - subnet-0cc43286651b1e2d9
          - subnet-03602b4d349546b6b
          - subnet-0ffadc50f6a7a1f26
      Environment:
        Variables:
          DB_HOST: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-host}}"
          DB_NAME: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-name}}"
          DB_USER: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-user}}"
          DB_PASSWORD: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-password}}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-jwt-key}}"
          # Clerk webhook (POST /webhooks/clerk): signups auto-create the local
          # users row. The SSM param /lexflow/api/${Environment}/clerk-webhook-secret
          # must exist (whsec_...) before deploy — CFN resolves it here.
          CLERK_WEBHOOK_SECRET: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-webhook-secret}}"
          ENVIRONMENT: !Ref Environment
          # Relay outbox bucket: the API PutObjects jobs/{userId}/{id}.json and reads
          # results/{userId}/{id}.json. Literal !Sub (not !Ref) so the function takes
          # no CloudFormation dependency on the bucket (avoids the S3-event cycle).
          OUTBOX_BUCKET: !Sub "lexflow-relay-outbox-${Environment}"
      # Enqueue relay jobs + read their results via the relay outbox bucket (reached
      # through the free S3 gateway endpoint — no NAT, no Lambda interface endpoint).
      # Literal ARN (not !Ref) so the role takes no dependency on the bucket resource.
      Policies:
        - Statement:
            - Sid: RelayEnqueue
              Effect: Allow
              Action: s3:PutObject
              Resource:
                - !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/jobs/*"
                # Stream tickets (browser-direct streaming Lambda; no S3 event on
                # tickets/, so the relay never double-processes streamed jobs).
                - !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/tickets/*"
            - Sid: RelayReadResult
              Effect: Allow
              Action:
                - s3:GetObject
                - s3:ListBucket
              Resource:
                - !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/results/*"
                - !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LexFlowHttpApi
            Path: /{proxy+}
            Method: ANY

  LexFlowRelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-relay-${Environment}"
      RetentionInDays: 7

  # Outbound relay — NON-VPC (needs internet egress for Gemini / SMTP). S3-triggered:
  # the VPC API drops a job in the relay outbox bucket (jobs/ prefix) via the free S3
  # gateway endpoint, and this function runs on the ObjectCreated event, writes the
  # result under results/, and deletes the job. No Lambda interface endpoint needed.
  # Channel-routed: ai (Gemini) / email (SMTP scaffold). GitHub issues moved to the
  # central mrhewbuc-issues service (browser-direct).
  LexFlowRelayFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowRelayLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/relay/relay-handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
    Properties:
      FunctionName: !Sub lexflow-relay-${Environment}
      CodeUri: .
      Handler: api/relay/relay-handler.handler
      MemorySize: 256
      Tracing: PassThrough
      # NO VpcConfig — must reach the public internet.
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # SMTP / Gemini key fetched from here at runtime (KMS-decrypted).
          SSM_PREFIX: !Sub "/lexflow/relay/${Environment}"
      Events:
        # Fires when the API enqueues a job under the jobs/ prefix. The prefix filter
        # is essential: result writes land under results/ and must NOT re-trigger.
        OutboxJob:
          Type: S3
          Properties:
            Bucket: !Ref LexFlowRelayOutboxBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: jobs/
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "lexflow/relay/${Environment}/*"
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: RelayConsumeJob
              Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/jobs/*"
            - Sid: RelayWriteResult
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/results/*"

  LexFlowStreamLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-stream-${Environment}"
      RetentionInDays: 7

  # Browser-direct STREAMING Lambda — NON-VPC (needs internet for the LLM),
  # Function URL with RESPONSE_STREAM so tokens reach the browser as they are
  # generated (the S3-relay path stays as the non-streaming fallback). Trust
  # boundary: the tRPC API writes a ticket (tickets/{jobId}.json — a prefix with
  # NO S3 event) carrying the resolved prompt + the owner's Clerk sub; this
  # function verifies the caller's Clerk JWT offline and only streams when
  # sub matches. Result text is written to results/{userId}/{jobId}.json so the
  # existing finalize + credit-refund rails work unchanged. No RDS access.
  LexFlowStreamFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowStreamLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/stream/stream-handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
    Properties:
      FunctionName: !Sub lexflow-stream-${Environment}
      CodeUri: .
      Handler: api/stream/stream-handler.handler
      MemorySize: 256
      Tracing: PassThrough
      # NO VpcConfig — must reach the public internet.
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins: ["*"]
          AllowHeaders: [Content-Type, Authorization]
          AllowMethods: [POST]
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          SSM_PREFIX: !Sub "/lexflow/relay/${Environment}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-jwt-key}}"
          OUTBOX_BUCKET: !Sub "lexflow-relay-outbox-${Environment}"
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "lexflow/relay/${Environment}/*"
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"
            - Sid: StreamConsumeTicket
              Effect: Allow
              Action: [s3:GetObject, s3:DeleteObject]
              Resource: !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/tickets/*"
            - Sid: StreamWriteResult
              Effect: Allow
              Action: s3:PutObject
              Resource: !Sub "arn:aws:s3:::lexflow-relay-outbox-${Environment}/results/*"

  # Relay outbox bucket for the async job pattern (jobs/ in → relay → results/ out).
  # Private; a 1-day lifecycle clears stale jobs + results. The free S3 gateway
  # endpoint in the VPC lets the API Lambda reach it with no NAT.
  LexFlowRelayOutboxBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "lexflow-relay-outbox-${Environment}"
      LifecycleConfiguration:
        Rules:
          - Id: expire-jobs
            Status: Enabled
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: Custom domain URL (use this as VITE_API_URL)
    Value: "https://api.probius.app"
  ApiGatewayUrl:
    Description: Original API Gateway endpoint (still resolves)
    Value: !Sub "https://${LexFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  CustomDomainName:
    Description: Regional CNAME target for api.probius.app DNS record in Cloudflare
    Value: !GetAtt LexFlowHttpApi.DomainName.RegionalDomainName
  FunctionArn:
    Value: !GetAtt LexFlowApiFunction.Arn
  RelayFunctionArn:
    Description: Outbound relay Lambda ARN (invoked by the API for ai/github/email)
    Value: !GetAtt LexFlowRelayFunction.Arn
  StreamFunctionUrl:
    Description: Streaming Lambda Function URL (use as VITE_AI_STREAM_URL)
    Value: !GetAtt LexFlowStreamFunctionUrl.FunctionUrl
