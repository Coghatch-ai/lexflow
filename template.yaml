AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexFlow API - Lambda with API Gateway (HTTP API)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
    Tags:
      Project: lexflow
      Environment: !Ref Environment
      CostCenter: billable

Resources:
  LexFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-api-${Environment}"
      RetentionInDays: 7

  LexFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Domain:
        DomainName: api.probius.app
        CertificateArn: arn:aws:acm:sa-east-1:394559824800:certificate/4004112d-a1b0-4046-9b4f-8801af5e7c23
        EndpointConfiguration: REGIONAL
        SecurityPolicy: TLS_1_2
      # Bearer-token auth (no cookies); custom domain: api.probius.app
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - svix-id
          - svix-timestamp
          - svix-signature
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  LexFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowApiLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
        External:
          - pg-native
          - better-sqlite3
          - tedious
          - sqlite3
          - mysql
          - mysql2
          - pg-query-stream
          - oracledb
    Properties:
      FunctionName: !Sub lexflow-api-${Environment}
      CodeUri: .
      Handler: api/handler.handler
      Tracing: PassThrough
      # Shared VPC with the mrhewbuc-rds RDS instance (same SG + subnets as the
      # other MrHewbuc projects). No NAT — Lambda reaches RDS directly via the
      # private subnets.
      VpcConfig:
        SecurityGroupIds:
          - sg-0d065bb06c8c04a68
        SubnetIds:
          - subnet-0cc43286651b1e2d9
          - subnet-03602b4d349546b6b
          - subnet-0ffadc50f6a7a1f26
      Environment:
        Variables:
          DB_HOST: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-host}}"
          DB_NAME: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-name}}"
          DB_USER: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-user}}"
          DB_PASSWORD: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-password}}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-jwt-key}}"
          # Clerk webhook (POST /webhooks/clerk): signups auto-create the local
          # users row. The SSM param /lexflow/api/${Environment}/clerk-webhook-secret
          # must exist (whsec_...) before deploy — CFN resolves it here.
          CLERK_WEBHOOK_SECRET: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-webhook-secret}}"
          ENVIRONMENT: !Ref Environment
      # Invoke the outbound relay (non-VPC sender) for the ai/github/email channels.
      # Name-derived ARN (a plain !Sub string, NOT !GetAtt) so the API function's
      # role takes no CloudFormation dependency on the relay function.
      Policies:
        - Statement:
            - Effect: Allow
              Action: lambda:InvokeFunction
              Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:lexflow-relay-${Environment}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LexFlowHttpApi
            Path: /{proxy+}
            Method: ANY

  LexFlowRelayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-relay-${Environment}"
      RetentionInDays: 7

  # Outbound relay — NON-VPC (needs internet egress for Gemini / GitHub / SMTP).
  # Invoked ONLY by LexFlowApiFunction via IAM (no Function URL / API event), so
  # it is unreachable from a browser. The VPC-bound API function reaches the Lambda
  # control plane to invoke it through the shared interface endpoint already present
  # in this VPC (com.amazonaws.sa-east-1.lambda, vpce-0e7bd5c5b3c6f5e84, private DNS
  # on the same 3 subnets) — so no NAT and no per-stack VPC endpoint are needed.
  # Channel-routed: ai (Gemini) / github (issue ops) / email (SMTP scaffold).
  LexFlowRelayFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowRelayLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/relay/relay-handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
    Properties:
      FunctionName: !Sub lexflow-relay-${Environment}
      CodeUri: .
      Handler: api/relay/relay-handler.handler
      MemorySize: 256
      Tracing: PassThrough
      # NO VpcConfig — must reach the public internet.
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          # SMTP / Gemini key / GitHub PAT are fetched from here at runtime (KMS-decrypted).
          SSM_PREFIX: !Sub "/lexflow/relay/${Environment}"
          # Repo is server-derived — the caller (API) never picks it.
          GITHUB_REPO: Coghatch-ai/lexflow
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: !Sub "lexflow/relay/${Environment}/*"
        - Statement:
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

Outputs:
  ApiUrl:
    Description: Custom domain URL (use this as VITE_API_URL)
    Value: "https://api.probius.app"
  ApiGatewayUrl:
    Description: Original API Gateway endpoint (still resolves)
    Value: !Sub "https://${LexFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  CustomDomainName:
    Description: Regional CNAME target for api.probius.app DNS record in Cloudflare
    Value: !GetAtt LexFlowHttpApi.DomainName.RegionalDomainName
  FunctionArn:
    Value: !GetAtt LexFlowApiFunction.Arn
  RelayFunctionArn:
    Description: Outbound relay Lambda ARN (invoked by the API for ai/github/email)
    Value: !GetAtt LexFlowRelayFunction.Arn
