AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LexFlow API - Lambda with API Gateway (HTTP API)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]
  ApiDomainName:
    Type: String
    Default: ""
    Description: >-
      Custom domain for the API (e.g. api.probius.app). Empty = use the default
      execute-api URL only. When set, ApiCertificateArn is required.
  ApiCertificateArn:
    Type: String
    Default: ""
    Description: >-
      ACM certificate ARN for ApiDomainName. MUST be in this stack's region
      (sa-east-1) — API Gateway regional custom domains require a regional cert.

Conditions:
  HasApiDomain: !Not [!Equals [!Ref ApiDomainName, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs22.x
    Tags:
      Project: lexflow
      Environment: !Ref Environment
      CostCenter: billable

Resources:
  LexFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/lexflow-api-${Environment}"
      RetentionInDays: 7

  LexFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      # CORS is locked to the SPA origin. Auth is via bearer token (no cookies), so
      # this is defense-in-depth: only the frontend origin can read API responses
      # from a browser. The custom domain (api.probius.app) is wired below.
      CorsConfiguration:
        AllowOrigins: ["https://my.probius.app"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - svix-id
          - svix-timestamp
          - svix-signature
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  # Custom domain for the API (created only when ApiDomainName is set). The ACM cert
  # must be regional (sa-east-1). The empty-key ApiMapping maps the domain root to the
  # stage, so api.probius.app/{x} → ${Environment} stage /{x} (no /prod in the URL).
  LexFlowApiDomain:
    Type: AWS::ApiGatewayV2::DomainName
    Condition: HasApiDomain
    Properties:
      DomainName: !Ref ApiDomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref ApiCertificateArn
          EndpointType: REGIONAL
          SecurityPolicy: TLS_1_2

  LexFlowApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Condition: HasApiDomain
    Properties:
      ApiId: !Ref LexFlowHttpApi
      DomainName: !Ref LexFlowApiDomain
      Stage: !Ref Environment

  LexFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: LexFlowApiLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
        External:
          - pg-native
          - better-sqlite3
          - tedious
          - sqlite3
          - mysql
          - mysql2
          - pg-query-stream
          - oracledb
    Properties:
      FunctionName: !Sub lexflow-api-${Environment}
      CodeUri: .
      Handler: api/handler.handler
      Tracing: PassThrough
      # Shared VPC with the mrhewbuc-rds RDS instance (same SG + subnets as the
      # other MrHewbuc projects). No NAT — Lambda reaches RDS directly via the
      # private subnets.
      VpcConfig:
        SecurityGroupIds:
          - sg-0d065bb06c8c04a68
        SubnetIds:
          - subnet-0cc43286651b1e2d9
          - subnet-03602b4d349546b6b
          - subnet-0ffadc50f6a7a1f26
      Environment:
        Variables:
          DB_HOST: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-host}}"
          DB_NAME: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-name}}"
          DB_USER: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-user}}"
          DB_PASSWORD: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/db-password}}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-jwt-key}}"
          # Clerk webhook is deferred for the POC (users are created manually via
          # `pnpm db:create-user`). When the webhook lands, add the
          # /lexflow/api/${Environment}/clerk-webhook-secret SSM param and restore:
          # CLERK_WEBHOOK_SECRET: !Sub "{{resolve:ssm:/lexflow/api/${Environment}/clerk-webhook-secret}}"
          ENVIRONMENT: !Ref Environment
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref LexFlowHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint (use this as VITE_API_URL)
    Value: !Sub "https://${LexFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  FunctionArn:
    Value: !GetAtt LexFlowApiFunction.Arn
  ApiCustomDomainTarget:
    Condition: HasApiDomain
    Description: Point the api.* DNS record (CNAME, DNS-only) at this regional domain
    Value: !GetAtt LexFlowApiDomain.RegionalDomainName
  ApiCustomDomainHostedZoneId:
    Condition: HasApiDomain
    Description: Regional hosted zone id (for Route53 alias setups; unused with Cloudflare)
    Value: !GetAtt LexFlowApiDomain.RegionalHostedZoneId
