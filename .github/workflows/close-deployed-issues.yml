name: Close Deployed Issues

# Auto-close issues once their fix is LIVE in prod (not merely merged).
# A fix is merged -> labelled `fixed-pending-deploy`; this runs after a
# successful "Deploy API"/"Deploy App" on main and closes every such issue.
# Pairs with the GitHub auto-close keyword convention in CLAUDE.md, but fires
# on deploy instead of merge, matching the deploy-gated workflow.

on:
  workflow_run:
    workflows: ["Deploy API", "Deploy App"]
    types: [completed]

permissions:
  issues: write
  contents: read
  id-token: write

jobs:
  close:
    # Only on a green deploy of main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      WF: ${{ github.event.workflow_run.name }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      RELAY_OUTBOX: lexflow-relay-outbox-prod
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: sa-east-1

      - name: Close issues labelled fixed-pending-deploy
        run: |
          set -euo pipefail
          nums=$(gh issue list --repo "$REPO" --state open \
            --label fixed-pending-deploy --json number --jq '.[].number')
          if [ -z "$nums" ]; then
            echo "No open issues labelled fixed-pending-deploy — nothing to close."
            exit 0
          fi
          for n in $nums; do
            echo "Closing #$n (deployed via $WF @ ${SHA:0:7})"

            # ── Optional email notification ──────────────────────────────────
            # Parse the Solicitante footer written by shared/domain/github-issue.ts
            # appendRequester. grep is line-scoped (NOT multiline); anchor to the
            # line start — NOT equivalent to REQUESTER_RE which operates on the
            # full string.
            body=$(gh issue view "$n" --repo "$REPO" --json body --jq '.body')
            title=$(gh issue view "$n" --repo "$REPO" --json title --jq '.title')
            requester=$(printf '%s' "$body" | grep -m1 -oP '^Solicitante: \K.+' || true)
            if [ -n "$requester" ] && [ "$requester" != "desconhecido" ]; then
              subject="[Probius] Sua solicitação #${n} foi resolvida"
              mail_body=$(printf 'Olá,\n\nSua solicitação "%s" (issue #%s) foi resolvida e publicada em produção.\n\nAcesse a plataforma em https://my.probius.app para conferir as melhorias.\n\nObrigado pelo seu feedback!\n\n— Equipe Probius\n\n---\nEste e-mail foi enviado para %s porque você abriu uma solicitação na plataforma Probius.' "$title" "$n" "$requester")
              job_id=$(uuidgen)
              printf '%s' "{\"channel\":\"email\",\"to\":\"${requester}\",\"subject\":\"${subject}\",\"body\":$(printf '%s' "$mail_body" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')}" \
                | aws s3 cp - "s3://${RELAY_OUTBOX}/jobs/system/${job_id}.json" || true
              echo "Email job ${job_id} enqueued for ${requester}"
            else
              echo "No valid requester email for #$n — skipping notification"
            fi
            # ────────────────────────────────────────────────────────────────

            # Drop the deploy-gate labels (ignore if one isn't present).
            gh issue edit "$n" --repo "$REPO" \
              --remove-label fixed-pending-deploy --remove-label needs-deploy || true
            gh issue close "$n" --repo "$REPO" \
              -c "✅ Deploy em produção concluído ($WF, commit ${SHA:0:7}). Fechando automaticamente."
          done
